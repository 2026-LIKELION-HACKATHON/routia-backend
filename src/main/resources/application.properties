spring.application.name=routia-back
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

routia.mail.from=${MAIL_FROM:no-reply@routia.local}
routia.jwt.secret=${JWT_SECRET}
routia.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600}
routia.profile-image.directory=${PROFILE_IMAGE_DIRECTORY:${java.io.tmpdir}/routia-profile-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

routia.ai.provider=${AI_PROVIDER:unconfigured}
routia.ai.model=${AI_MODEL:}
routia.ai.prompt-version=${AI_PROMPT_VERSION:routine-v1}
routia.ai.prompt-resource=${AI_PROMPT_RESOURCE:classpath:prompts/routine-v1.txt}
routia.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
routia.routine-generation.scheduler-delay-ms=${ROUTINE_GENERATION_SCHEDULER_DELAY_MS:60000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=none
